<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0b1120;
    --surface: #121a2e;
    --surface-2: #182238;
    --line: #22304d;
    --text: #e9edf6;
    --muted: #7c879d;
    --accent: #2dd4a8;
    --accent-dim: #1c9c7c;
    --bubble-me: #1e5a4c;
    --bubble-them: #1a2338;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    display:flex; justify-content:center; align-items:center;
    min-height:100vh;
  }
  .shell{
    width:100%; max-width:460px; height:100vh; max-height:900px;
    background: var(--surface);
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  @media (min-width:500px){
    .shell{ border-radius:22px; height:92vh; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  }
  .screen{ display:none; flex-direction:column; height:100%; }
  .screen.active{ display:flex; }

  /* ---------- brand mark ---------- */
  .brand-dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--accent);
    display:inline-block;
    box-shadow: 0 0 0 4px rgba(45,212,168,.15);
  }

  /* ---------- AUTH ---------- */
  .auth-wrap{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding: 36px 30px;
  }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .auth-brand span.name{ font-size:22px; font-weight:800; letter-spacing:.5px; }
  .auth-wrap h1{ font-size:26px; font-weight:800; margin:22px 0 6px; }
  .auth-wrap p.sub{ color:var(--muted); font-size:14px; margin-bottom:26px; }
  .field{ margin-bottom:14px; }
  .field input{
    width:100%; padding:15px 16px;
    background: var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    outline:none;
  }
  .field input:focus{ border-color: var(--accent); }
  .field input::placeholder{ color:#54607a; }
  .btn-primary{
    width:100%; padding:15px;
    background: var(--accent);
    color:#04231c;
    border:none; border-radius:14px;
    font-family:inherit; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:6px;
  }
  .btn-primary:active{ opacity:.85; }
  .auth-hint{ text-align:center; color:var(--muted); font-size:13px; margin-top:18px; }

  /* ---------- FRIENDS LIST ---------- */
  .top-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 14px;
  }
  .top-bar .title-block{ display:flex; align-items:center; gap:10px; }
  .top-bar h1{ font-size:24px; font-weight:800; }
  .me-chip{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--muted);
  }
  .icon-btn{
    background: var(--surface-2);
    border:1px solid var(--line);
    color:var(--muted);
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px;
  }
  .search-row{
    display:flex; gap:10px; padding:0 20px 14px;
  }
  .search-row input{
    flex:1; padding:12px 16px;
    background: var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:inherit; font-size:14px; outline:none;
  }
  .search-row button{
    padding:0 18px;
    background: var(--accent);
    color:#04231c; border:none; border-radius:12px;
    font-family:inherit; font-weight:700; font-size:14px;
    cursor:pointer;
  }
  .friends-scroll{ flex:1; overflow-y:auto; padding:4px 8px 12px; }
  .friend-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 12px; border-radius:16px;
    cursor:pointer;
  }
  .friend-row:active{ background: var(--surface-2); }
  .avatar{
    width:50px; height:50px; border-radius:16px;
    background: linear-gradient(145deg, var(--accent-dim), var(--accent));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; color:#04231c;
    flex-shrink:0;
  }
  .friend-meta{ flex:1; min-width:0; }
  .friend-meta .name{ font-weight:700; font-size:15.5px; margin-bottom:3px; }
  .friend-meta .preview{
    font-size:13px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .empty-note{
    text-align:center; color:var(--muted); font-size:13.5px;
    padding:60px 30px; line-height:1.7;
  }

  /* ---------- CHAT SCREEN ---------- */
  .chat-top{
    display:flex; align-items:center; gap:12px;
    padding:18px 18px;
    border-bottom:1px solid var(--line);
  }
  .chat-top .avatar{ width:40px; height:40px; font-size:15px; border-radius:12px; }
  .chat-top .who h3{ font-size:16px; font-weight:700; }
  .chat-top .who span{ font-size:12px; color:var(--accent); }
  .back-icon{
    background:none; border:none; color:var(--text);
    font-size:20px; cursor:pointer; padding:4px;
  }
  .messages{
    flex:1; overflow-y:auto; padding:18px 14px;
    display:flex; flex-direction:column; gap:9px;
  }
  .bubble{
    max-width:74%; padding:11px 15px;
    border-radius:18px; font-size:14.5px; line-height:1.45;
    word-wrap:break-word;
  }
  .bubble.me{
    align-self:flex-start; background: var(--bubble-me);
    border-bottom-left-radius:5px; color:#eafff7;
  }
  .bubble.them{
    align-self:flex-end; background: var(--bubble-them);
    border-bottom-right-radius:5px;
  }
  .composer{
    display:flex; gap:10px; padding:14px;
    border-top:1px solid var(--line);
  }
  .composer input{
    flex:1; padding:13px 18px; border-radius:24px;
    background: var(--surface-2); border:1px solid var(--line);
    color:var(--text); font-family:inherit; font-size:14.5px; outline:none;
  }
  .composer button{
    width:46px; height:46px; border-radius:50%;
    background: var(--accent); color:#04231c; border:none;
    font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ============ AUTH ============ -->
  <div id="screen-auth" class="screen active">
    <div class="auth-wrap">
      <div class="auth-brand">
        <span class="brand-dot"></span>
        <span class="name">chat</span>
      </div>
      <h1>مرحباً بك</h1>
      <p class="sub">اكتب اسمك للدخول ومراسلة أصدقائك</p>
      <div class="field">
        <input id="usernameInput" type="text" placeholder="اسمك">
      </div>
      <button class="btn-primary" id="loginBtn">دخول</button>
      <div class="auth-hint">استخدم نفس الاسم دايمًا عشان أصدقاءك يلقونك</div>
    </div>
  </div>

  <!-- ============ FRIENDS LIST ============ -->
  <div id="screen-friends" class="screen">
    <div class="top-bar">
      <div class="title-block">
        <span class="brand-dot"></span>
        <h1>chat</h1>
      </div>
      <button class="icon-btn" id="logoutBtn" title="خروج">⏻</button>
    </div>
    <div class="me-chip" style="padding:0 20px 14px;">مسجل باسم: <b id="meName" style="color:var(--text)"></b></div>
    <div class="search-row">
      <input id="newFriendInput" type="text" placeholder="اسم صديق جديد...">
      <button id="startChatBtn">فتح</button>
    </div>
    <div class="friends-scroll" id="friendsScroll">
      <div class="empty-note">ما عندك محادثات بعد.<br>اكتب اسم صديقك بالأعلى وابدأ أول محادثة.</div>
    </div>
  </div>

  <!-- ============ CHAT ============ -->
  <div id="screen-chat" class="screen">
    <div class="chat-top">
      <button class="back-icon" id="backBtn">→</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div class="who">
        <h3 id="chatName"></h3>
        <span>متصل الآن</span>
      </div>
    </div>
    <div class="messages" id="messagesEl"></div>
    <div class="composer">
      <input id="msgInput" type="text" placeholder="اكتب رسالة...">
      <button id="sendBtn">↑</button>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://roqpinipcgwqeqqfpcjm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = '';
let currentReceiver = '';
let friends = [];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function initials(name){
  return (name || '?').trim().charAt(0).toUpperCase();
}

/* ---------------- Auth ---------------- */
document.getElementById('loginBtn').onclick = () => {
  const name = document.getElementById('usernameInput').value.trim();
  if(!name){ alert('اكتب اسمك أولاً'); return; }
  currentUser = name;
  document.getElementById('meName').innerText = currentUser;
  showScreen('screen-friends');
  loadExistingChats();
  subscribeToRealtime();
};

document.getElementById('logoutBtn').onclick = () => {
  currentUser = '';
  friends = [];
  document.getElementById('usernameInput').value = '';
  showScreen('screen-auth');
};

/* ---------------- Friends list ---------------- */
document.getElementById('startChatBtn').onclick = () => {
  const name = document.getElementById('newFriendInput').value.trim();
  if(!name || name === currentUser){ alert('اكتب اسم صديق صالح'); return; }
  if(!friends.includes(name)) friends.push(name);
  document.getElementById('newFriendInput').value = '';
  openChat(name);
};

async function loadExistingChats(){
  const { data, error } = await supabaseClient
    .from('message')
    .select('sender, receiver')
    .or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);

  if(!error && data){
    data.forEach(m => {
      const other = m.sender === currentUser ? m.receiver : m.sender;
      if(other && !friends.includes(other)) friends.push(other);
    });
    renderFriends();
  }
}

function renderFriends(){
  const el = document.getElementById('friendsScroll');
  el.innerHTML = '';
  if(friends.length === 0){
    el.innerHTML = '<div class="empty-note">ما عندك محادثات بعد.<br>اكتب اسم صديقك بالأعلى وابدأ أول محادثة.</div>';
    return;
  }
  friends.forEach(f => {
    const row = document.createElement('div');
    row.className = 'friend-row';
    row.innerHTML = `
      <div class="avatar">${initials(f)}</div>
      <div class="friend-meta">
        <div class="name">${f}</div>
        <div class="preview">اضغط لفتح المحادثة</div>
      </div>`;
    row.onclick = () => openChat(f);
    el.appendChild(row);
  });
}

/* ---------------- Chat screen ---------------- */
function openChat(friend){
  currentReceiver = friend;
  document.getElementById('chatName').innerText = friend;
  document.getElementById('chatAvatar').innerText = initials(friend);
  showScreen('screen-chat');
  loadMessages();
}

document.getElementById('backBtn').onclick = () => {
  currentReceiver = '';
  showScreen('screen-friends');
  loadExistingChats();
};

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentReceiver) return;
  input.value = '';

  const { error } = await supabaseClient
    .from('message')
    .insert([{ sender: currentUser, receiver: currentReceiver, text }]);

  if(error) alert('خطأ في الإرسال: ' + error.message);
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keypress', e => {
  if(e.key === 'Enter') sendMessage();
});

async function loadMessages(){
  const { data, error } = await supabaseClient
    .from('message')
    .select('*')
    .or(`and(sender.eq.${currentUser},receiver.eq.${currentReceiver}),and(sender.eq.${currentReceiver},receiver.eq.${currentUser})`)
    .order('created_at', { ascending: true });

  const box = document.getElementById('messagesEl');
  box.innerHTML = '';
  if(!error && data) data.forEach(appendMessage);
}

function appendMessage(msg){
  const relevant =
    (msg.sender === currentUser && msg.receiver === currentReceiver) ||
    (msg.sender === currentReceiver && msg.receiver === currentUser);
  if(!relevant) return;

  const box = document.getElementById('messagesEl');
  const div = document.createElement('div');
  div.className = 'bubble ' + (msg.sender === currentUser ? 'me' : 'them');
  div.innerText = msg.text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function subscribeToRealtime(){
  supabaseClient
    .channel('public:message')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'message' }, payload => {
      appendMessage(payload.new);
    })
    .subscribe();
}
</script>
</body>
</html>
