<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مراسلة حقيقي</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --my-msg: #6366f1;
            --other-msg: #334155;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 500px) {
            .app-container {
                border-radius: 20px;
                height: 90vh;
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* شاشة المصادقة */
        .auth-container {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        .auth-container h1 {
            margin-bottom: 8px;
            color: var(--primary-color);
            font-size: 24px;
        }

        .auth-container p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .switch-auth {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-auth span {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: bold;
        }

        /* شاشة قائمة الأصدقاء */
        .header {
            padding: 15px 20px;
            background-color: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .header h2 {
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        }

        .friend-item:hover {
            background-color: #334155;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-left: 15px;
            color: white;
        }

        .friend-info {
            flex: 1;
        }

        .friend-info h4 {
            font-size: 15px;
            margin-bottom: 3px;
        }

        .friend-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* شاشة المحادثة */
        .chat-header {
            padding: 12px 15px;
            background-color: #111827;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.my-message {
            background-color: var(--my-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.other-message {
            background-color: var(--other-msg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #111827;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            font-size: 16px;
        }

        .send-btn:hover {
            background-color: var(--primary-hover);
        }

        /* نافذة منبثقة بسيطة لإضافة صديق */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. شاشة تسجيل الدخول -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <h1 id="auth-title">تسجيل الدخول</h1>
                <p id="auth-subtitle">مرحباً بك مجدداً، أضف بياناتك للمتابعة</p>
                
                <div class="input-group" id="name-group" style="display: none;">
                    <label>الاسم الكامل</label>
                    <input type="text" id="fullname" placeholder="أدخل اسمك...">
                </div>

                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="name@example.com">
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                
                <button class="btn" id="auth-btn" onclick="handleAuth()">دخول</button>
                
                <div class="switch-auth" id="switch-text">
                    ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>
                </div>
            </div>
        </div>

        <!-- 2. شاشة قائمة الأصدقاء -->
        <div id="friends-screen" class="screen">
            <div class="header">
                <h2>المحادثات</h2>
                <div class="header-actions">
                    <button class="icon-btn" onclick="openAddFriendModal()" title="إضافة صديق">➕</button>
                    <button class="icon-btn" onclick="logout()" title="تسجيل خروج">🚪</button>
                </div>
            </div>

            <div class="friends-list" id="friends-container">
                <!-- الأصدقاء سيتم تعبئتهم هنا برمجياً -->
            </div>
        </div>

        <!-- 3. شاشة المحادثة الفردية -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <button class="back-btn" onclick="goBackToFriends()">⬅</button>
                <div class="avatar" id="chat-avatar" style="width: 35px; height: 35px; font-size: 14px; margin-left: 0;">م</div>
                <div class="friend-info" style="flex:1;">
                    <h4 id="chat-friend-name" style="font-size: 15px;">اسم الصديق</h4>
                    <span style="font-size: 11px; color: #10b981;">متصل الآن</span>
                </div>
            </div>

            <div class="chat-messages" id="messages-container">
                <!-- الرسائل -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالتك..." onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- نافذة إضافة صديق -->
        <div id="add-friend-modal" class="modal">
            <div class="modal-content">
                <h3>إضافة صديق جديد</h3>
                <div class="input-group">
                    <label>اسم الصديق</label>
                    <input type="text" id="new-friend-name" placeholder="أدخل اسم صديقك...">
                </div>
                <div class="modal-actions">
                    <button class="btn" style="background-color: #334155;" onclick="closeAddFriendModal()">إلغاء</button>
                    <button class="btn" onclick="addFriend()">إضافة</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let isSignUpMode = false;
        let currentUser = "";
        let currentChatFriend = "";

        // قائمة أصدقاء افتراضية لو مافي بيانات مخزنة
        let friends = JSON.parse(localStorage.getItem('chat_friends')) || [
            { name: "أحمد محمد", lastMsg: "أهلاً بك في التطبيق!" },
            { name: "سارة خالد", lastMsg: "كيف المشروع الجديد؟" }
        ];

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const nameGroup = document.getElementById('name-group');
            const btn = document.getElementById('auth-btn');
            const switchText = document.getElementById('switch-text');

            if (isSignUpMode) {
                title.innerText = "إنشاء حساب جديد";
                subtitle.innerText = "سجل بياناتك لتبدأ أول محادثة";
                nameGroup.style.display = "block";
                btn.innerText = "تسجيل حساب";
                switchText.innerHTML = `لديك حساب بالفعل؟ <span onclick="toggleAuthMode()">تسجيل الدخول</span>`;
            } else {
                title.innerText = "تسجيل الدخول";
                subtitle.innerText = "مرحباً بك مجدداً، أضف بياناتك للمتابعة";
                nameGroup.style.display = "none";
                btn.innerText = "دخول";
                switchText.innerHTML = `ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>`;
            }
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                alert("الرجاء تعبئة جميع الحقول المطلوبة!");
                return;
            }

            if (isSignUpMode) {
                const fullname = document.getElementById('fullname').value.trim();
                if (!fullname) {
                    alert("الرجاء إدخال الاسم الكامل!");
                    return;
                }
                currentUser = fullname;
            } else {
                currentUser = email.split('@')[0];
            }

            // الانتقال لشاشة الأصدقاء مباشرة
            switchScreen('friends-screen');
            loadFriendsList();
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // تحميل قائمة الأصدقاء وعرضها
        function loadFriendsList() {
            const container = document.getElementById('friends-container');
            container.innerHTML = "";

            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = "friend-item";
                div.onclick = () => openChat(friend.name);

                div.innerHTML = `
                    <div class="avatar">${friend.name.charAt(0)}</div>
                    <div class="friend-info">
                        <h4>${friend.name}</h4>
                        <p>${friend.lastMsg || 'انقر للبدء بالمحادثة'}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // فتح نافذة الشات مع الصديق المحدد
        function openChat(friendName) {
            currentChatFriend = friendName;
            document.getElementById('chat-friend-name').innerText = friendName;
            document.getElementById('chat-avatar').innerText = friendName.charAt(0);

            switchScreen('chat-screen');
            loadMessages(friendName);
        }

        function goBackToFriends() {
            switchScreen('friends-screen');
            loadFriendsList();
        }

        // إضافة صديق جديد
        function openAddFriendModal() {
            document.getElementById('add-friend-modal').style.display = "flex";
        }

        function closeAddFriendModal() {
            document.getElementById('add-friend-modal').style.display = "none";
            document.getElementById('new-friend-name').value = "";
        }

        function addFriend() {
            const nameInput = document.getElementById('new-friend-name');
            const name = nameInput.value.trim();

            if(name === "") {
                alert("الرجاء إدخال اسم الصديق!");
                return;
            }

            friends.push({ name: name, lastMsg: "تمت الإضافة حديثاً" });
            localStorage.setItem('chat_friends', JSON.stringify(friends));
            
            closeAddFriendModal();
            loadFriendsList();
        }

        // إرسال رسالة داخل شات الصديق
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(text === "") return;

            appendMessage(text, 'my-message');
            input.value = "";

            // حفظ الرسالة وتحديث آخر رسالة مع هذا الصديق
            saveMessage(currentChatFriend, text, 'my-message');
        }

        function appendMessage(text, className) {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function checkEnter(event) {
            if(event.key === 'Enter') {
                sendMessage();
            }
        }

        // حفظ وتحميل الرسائل الخاصة بكل صديق منفصلة
        function saveMessage(friendName, text, className) {
            let allChats = JSON.parse(localStorage.getItem('all_chats')) || {};
            if(!allChats[friendName]) allChats[friendName] = [];
            
            allChats[friendName].push({ text, className });
            localStorage.setItem('all_chats', JSON.stringify(allChats));

            // تحديث آخر رسالة في قائمة الأصدقاء
            let friend = friends.find(f => f.name === friendName);
            if(friend) friend.lastMsg = text;
            localStorage.setItem('chat_friends', JSON.stringify(friends));
        }

        function loadMessages(friendName) {
            const container = document.getElementById('messages-container');
            container.innerHTML = "";

            let allChats = JSON.parse(localStorage.getItem('all_chats')) || {};
            let messages = allChats[friendName] || [
                { text: `مرحباً بك! هذه بداية محادثتك مع ${friendName}`, className: 'other-message' }
            ];

            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.className}`;
                msgDiv.innerText = msg.text;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function logout() {
            switchScreen('auth-screen');
        }
    </script>
</body>
</html>
