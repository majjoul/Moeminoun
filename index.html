<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المراسلة الفورية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #0084ff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #006dd9; }
        #chat-box { height: 300px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 5px; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 5px; background: #e4e6eb; max-width: 80%; }
        .my-message { background: #dcf8c6; margin-right: auto; text-align: left; }
    </style>
</head>
<body>

    <div class="container" id="auth-screen">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم الخاص بك">
        <button onclick="login()">دخول للمحادثة</button>
    </div>

    <div class="container" id="chat-screen" style="display:none;">
        <h3>المحادثة كـ: <span id="current-user" style="color: #0084ff;"></span></h3>
        <input type="text" id="receiver" placeholder="اسم المستخدم للمستقبل (صديقك)">
        <div id="chat-box"></div>
        <input type="text" id="message-text" placeholder="اكتب رسالتك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // ضع هنا بيانات الـ Supabase الخاصة بك
        const SUPABASE_URL = 'ضع_رابط_الـ_Supabase_هنا';
        const SUPABASE_KEY = 'ضع_مفتاح_الـ_Anon_Key_هنا';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = '';

        function login() {
            currentUser = document.getElementById('username').value.trim();
            if (!currentUser) {
                alert('الرجاء إدخال اسم المستخدم!');
                return;
            }
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'block';
            document.getElementById('current-user').innerText = currentUser;
            
            loadMessages();
            subscribeToRealtime();
        }

        async function sendMessage() {
            const receiver = document.getElementById('receiver').value.trim();
            const text = document.getElementById('message-text').value.trim();

            if (!receiver || !text) {
                alert('الرجاء إدخال اسم المستقبل ونص الرسالة!');
                return;
            }

            const { error } = await supabase
                .from('messages')
                .insert([{ sender: currentUser, receiver: receiver, text: text }]);

            if (error) {
                alert('خطأ في الإرسال: ' + error.message);
            } else {
                document.getElementById('message-text').value = '';
            }
        }

        async function loadMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('خطأ في تحميل الرسائل:', error);
                return;
            }

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            data.forEach(msg => {
                displayMessage(msg);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function displayMessage(msg) {
            const receiverInput = document.getElementById('receiver').value.trim();
            // عرض الرسائل التي تخص المحادثة بين المستخدم الحالي والمستقبل المحدد
            if (
                (msg.sender === currentUser && msg.receiver === receiverInput) ||
                (msg.sender === receiverInput && msg.receiver === currentUser)
            ) {
                const chatBox = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = 'message' + (msg.sender === currentUser ? ' my-message' : '');
                div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function subscribeToRealtime() {
            supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    displayMessage(payload.new);
                })
                .subscribe();
        }
    </script>
</body>
</html>
