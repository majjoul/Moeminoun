<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المراسلة الفورية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #0084ff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #006dd9; }
        #chat-section { display: none; }
        #chat-box { height: 250px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 5px; display: flex; flex-direction: column; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 5px; background: #e4e6eb; max-width: 80%; align-self: flex-start; text-align: right; word-break: break-word; }
        .my-message { background: #dcf8c6; align-self: flex-end; text-align: right; }
        .friend-item { padding: 10px; background: #e9ecef; margin: 6px 0; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .friend-item:hover { background: #dde2e6; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="container" id="auth-screen">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="ادخل اسم المستخدم الخاص بك">
        <button onclick="login()">دخول</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div class="container" id="chat-section">
        <h3>مرحباً، <span id="current-user" style="color: #0084ff;"></span></h3>
        
        <div style="border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 10px;" id="friends-section">
            <h4>قائمة الأصدقاء</h4>
            <input type="text" id="new-friend-name" placeholder="اسم صديق جديد للمراسلة">
            <button onclick="startChatWithNewFriend()" style="background: #28a745;">بدء محادثة ➕</button>
            <div id="friends-list" style="max-height: 140px; overflow-y: auto; margin-top: 5px;"></div>
        </div>

        <div id="active-chat-box" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <h4 style="margin: 0;">المحادثة مع: <span id="chat-with" style="color: #28a745;"></span></h4>
                <button onclick="backToFriends()" style="background: #6c757d; width: auto; padding: 5px 12px; margin: 0;">العودة للأصدقاء</button>
            </div>
            <div id="chat-box"></div>
            <input type="text" id="message-text" placeholder="اكتب رسالتك هنا..." onkeypress="checkEnter(event)">
            <button onclick="sendMessage()">إرسال ✈️</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://roqpinipcgwqeqqfpcjm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = '';
        let currentReceiver = '';
        let friends = [];

        function login() {
            currentUser = document.getElementById('username').value.trim();
            if (!currentUser) {
                alert('الرجاء إدخال اسم المستخدم!');
                return;
            }
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-section').style.display = 'block';
            document.getElementById('current-user').innerText = currentUser;
            
            loadExistingChats();
            subscribeToRealtime();
        }

        // بدء محادثة مباشرة مع أي صديق يتم إدخاله دون أخطاء
        function startChatWithNewFriend() {
            const friendName = document.getElementById('new-friend-name').value.trim();
            if (!friendName || friendName === currentUser) {
                alert('الرجاء إدخال اسم صديق صالح يختلف عن اسمك!');
                return;
            }
            
            if (!friends.includes(friendName)) {
                friends.push(friendName);
                renderFriends();
            }
            
            document.getElementById('new-friend-name').value = '';
            openChat(friendName);
        }

        async function loadExistingChats() {
            // جلب الأصدقاء السابقين الذين تم مراسلتهم من قاعدة البيانات تلقائياً
            const { data, error } = await supabaseClient
                .from('message')
                .select('sender, receiver')
                .or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);

            if (!error && data) {
                data.forEach(msg => {
                    let otherUser = msg.sender === currentUser ? msg.receiver : msg.sender;
                    if (otherUser && !friends.includes(otherUser)) {
                        friends.push(otherUser);
                    }
                });
                renderFriends();
            }
        }

        function renderFriends() {
            const listDiv = document.getElementById('friends-list');
            listDiv.innerHTML = '';
            if (friends.length === 0) {
                listDiv.innerHTML = '<p style="color: #888; font-size: 13px; text-align:center;">لا توجد محادثات سابقة. أضف اسماً للبدء!</p>';
                return;
            }
            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `<span>👤 ${friend}</span> <button style="width: auto; padding: 5px 12px; margin:0;" onclick="openChat('${friend}')">فتح المحادثة</button>`;
                listDiv.appendChild(div);
            });
        }

        function openChat(friend) {
            currentReceiver = friend;
            document.getElementById('chat-with').innerText = friend;
            document.getElementById('friends-section').style.display = 'none';
            document.getElementById('active-chat-box').style.display = 'block';
            loadMessages();
        }

        function backToFriends() {
            document.getElementById('active-chat-box').style.display = 'none';
            document.getElementById('friends-section').style.display = 'block';
            currentReceiver = '';
            loadExistingChats(); // تحديث القائمة عند العودة
        }

        async function sendMessage() {
            const text = document.getElementById('message-text').value.trim();
            if (!text || !currentReceiver) return;

            const { error } = await supabaseClient
                .from('message')
                .insert([{ sender: currentUser, receiver: currentReceiver, text: text }]);

            if (error) {
                alert('خطأ في الإرسال: ' + error.message);
            } else {
                document.getElementById('message-text').value = '';
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('message')
                .select('*')
                .or(`and(sender.eq.${currentUser},receiver.eq.${currentReceiver}),and(sender.eq.${currentReceiver},receiver.eq.${currentUser})`)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('خطأ في تحميل الرسائل:', error.message);
                return;
            }

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    appendMessageToUI(msg);
                });
            }
        }

        function appendMessageToUI(msg) {
            if (
                (msg.sender === currentUser && msg.receiver === currentReceiver) ||
                (msg.sender === currentReceiver && msg.receiver === currentUser)
            ) {
                const chatBox = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = 'message' + (msg.sender === currentUser ? ' my-message' : '');
                div.innerHTML = `<strong>${msg.sender === currentUser ? 'أنا' : msg.sender}:</strong> ${msg.text}`;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function subscribeToRealtime() {
            supabaseClient
                .channel('public:message')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message' }, payload => {
                    appendMessageToUI(payload.new);
                })
                .subscribe();
        }
    </script>
</body>
</html>
