<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0b1120;
    --surface: #121a2e;
    --surface-2: #182238;
    --line: #22304d;
    --text: #e9edf6;
    --muted: #7c879d;
    --accent: #2dd4a8;
    --accent-dim: #1c9c7c;
    --bubble-me: #1e5a4c;
    --bubble-them: #1a2338;
    --danger: #e07a6b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    display:flex; justify-content:center; align-items:center;
    min-height:100vh;
  }
  .shell{
    width:100%; max-width:460px; height:100vh; max-height:900px;
    background: var(--surface);
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  @media (min-width:500px){
    .shell{ border-radius:22px; height:92vh; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  }
  .screen{ display:none; flex-direction:column; height:100%; }
  .screen.active{ display:flex; }

  .brand-dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--accent);
    display:inline-block;
    box-shadow: 0 0 0 4px rgba(45,212,168,.15);
  }

  /* ---------- AUTH ---------- */
  .auth-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 30px; overflow-y:auto; }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .auth-brand span.name{ font-size:22px; font-weight:800; letter-spacing:.5px; }
  .auth-wrap h1{ font-size:24px; font-weight:800; margin:18px 0 6px; }
  .auth-wrap p.sub{ color:var(--muted); font-size:13.5px; margin-bottom:20px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .field input{
    width:100%; padding:14px 16px; background: var(--surface-2);
    border:1px solid var(--line); border-radius:14px; color:var(--text);
    font-family:inherit; font-size:14.5px; outline:none;
  }
  .field input:focus{ border-color: var(--accent); }
  .field input::placeholder{ color:#54607a; }
  .btn-primary{
    width:100%; padding:14px; background: var(--accent); color:#04231c;
    border:none; border-radius:14px; font-family:inherit; font-size:15px;
    font-weight:700; cursor:pointer; margin-top:6px;
  }
  .btn-primary:active{ opacity:.85; }
  .auth-hint{ text-align:center; color:var(--muted); font-size:13px; margin-top:16px; }
  .auth-hint b{ color:var(--accent); cursor:pointer; font-weight:700; }
  .auth-error{ color:var(--danger); font-size:12.5px; min-height:16px; margin-top:8px; text-align:center; }

  /* ---------- FRIENDS LIST ---------- */
  .top-bar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 14px; }
  .top-bar .title-block{ display:flex; align-items:center; gap:10px; }
  .top-bar h1{ font-size:24px; font-weight:800; }
  .me-chip{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .icon-btn{
    background: var(--surface-2); border:1px solid var(--line); color:var(--muted);
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:16px;
  }
  .search-row{ display:flex; gap:10px; padding:0 20px 14px; }
  .search-row input{
    flex:1; padding:12px 16px; background: var(--surface-2); border:1px solid var(--line);
    border-radius:12px; color:var(--text); font-family:inherit; font-size:14px; outline:none;
  }
  .search-row button{
    padding:0 18px; background: var(--accent); color:#04231c; border:none;
    border-radius:12px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  .friends-scroll{ flex:1; overflow-y:auto; padding:4px 8px 12px; }
  .friend-row{ display:flex; align-items:center; gap:14px; padding:14px 12px; border-radius:16px; cursor:pointer; }
  .friend-row:active{ background: var(--surface-2); }
  .avatar{
    width:50px; height:50px; border-radius:16px;
    background: linear-gradient(145deg, var(--accent-dim), var(--accent));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; color:#04231c; flex-shrink:0;
  }
  .friend-meta{ flex:1; min-width:0; }
  .friend-meta .name{ font-weight:700; font-size:15.5px; margin-bottom:3px; }
  .friend-meta .preview{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-note{ text-align:center; color:var(--muted); font-size:13.5px; padding:60px 30px; line-height:1.7; }

  /* ---------- CHAT SCREEN ---------- */
  .chat-top{ display:flex; align-items:center; gap:12px; padding:18px 18px; border-bottom:1px solid var(--line); }
  .chat-top .avatar{ width:40px; height:40px; font-size:15px; border-radius:12px; }
  .chat-top .who{ flex:1; }
  .chat-top .who h3{ font-size:16px; font-weight:700; }
  .chat-top .who span{ font-size:12px; color:var(--accent); }
  .back-icon{ background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px; }
  .call-icon{
    background: var(--surface-2); border:1px solid var(--line); color:var(--accent);
    width:40px; height:40px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:17px;
  }
  .messages{ flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:9px; }
  .bubble{ max-width:74%; padding:11px 15px; border-radius:18px; font-size:14.5px; line-height:1.45; word-wrap:break-word; }
  .bubble.me{ align-self:flex-start; background: var(--bubble-me); border-bottom-left-radius:5px; color:#eafff7; }
  .bubble.them{ align-self:flex-end; background: var(--bubble-them); border-bottom-right-radius:5px; }
  .composer{ display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); }
  .composer input{
    flex:1; padding:13px 18px; border-radius:24px; background: var(--surface-2);
    border:1px solid var(--line); color:var(--text); font-family:inherit; font-size:14.5px; outline:none;
  }
  .composer button{
    width:46px; height:46px; border-radius:50%; background: var(--accent);
    color:#04231c; border:none; font-size:18px; cursor:pointer;
  }
  .mic-btn{
    width:46px; height:46px; border-radius:50%; border:none;
    background: var(--surface-2); border:1px solid var(--line);
    color:var(--text); font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .mic-btn.recording{
    background: var(--danger); color:#fff; border-color:var(--danger);
    animation: pulse 1s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(224,122,107,.5); }
    70%{ box-shadow:0 0 0 10px rgba(224,122,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(224,122,107,0); }
  }
  .voice-bubble{ display:flex; align-items:center; gap:8px; }
  .voice-bubble audio{ height:34px; max-width:190px; }

  /* ---------- VIDEO CALL OVERLAY ---------- */
  #callOverlay{
    display:none; position:absolute; inset:0; background:#05070d;
    z-index:50; flex-direction:column;
  }
  #callOverlay.active{ display:flex; }
  #remoteVideo{
    width:100%; height:100%; object-fit:cover; background:#000;
  }
  #localVideo{
    position:absolute; width:110px; height:150px; object-fit:cover;
    border-radius:14px; bottom:130px; left:16px; border:2px solid var(--accent);
    background:#000;
  }
  .call-status{
    position:absolute; top:24px; left:0; right:0; text-align:center;
    color:#fff; font-size:14px; font-weight:600;
  }
  .call-controls{
    position:absolute; bottom:30px; left:0; right:0;
    display:flex; justify-content:center; gap:22px;
  }
  .call-btn{
    width:58px; height:58px; border-radius:50%; border:none;
    font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .call-btn.end{ background: var(--danger); color:#fff; }
  .call-btn.accept{ background: var(--accent); color:#04231c; }

  /* incoming call modal */
  #incomingCall{
    display:none; position:absolute; inset:0; background:rgba(5,7,13,.92);
    z-index:60; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  #incomingCall.active{ display:flex; }
  #incomingCall .avatar{ width:90px; height:90px; font-size:32px; border-radius:24px; }
  #incomingCall h3{ font-size:19px; font-weight:700; }
  #incomingCall p{ color:var(--muted); font-size:13.5px; }
  .incoming-actions{ display:flex; gap:26px; margin-top:10px; }
</style>
</head>
<body>

<div class="shell">

  <!-- ============ AUTH ============ -->
  <div id="screen-auth" class="screen active">
    <div class="auth-wrap">
      <div class="auth-brand">
        <span class="brand-dot"></span>
        <span class="name">chat</span>
      </div>
      <h1 id="authTitle">تسجيل الدخول</h1>
      <p class="sub" id="authSub">ادخل بياناتك للوصول لمحادثاتك بأمان</p>

      <div class="field">
        <label>اسم المستخدم</label>
        <input id="usernameInput" type="text" placeholder="مثال: خالد">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input id="passwordInput" type="password" placeholder="••••••••">
      </div>

      <button class="btn-primary" id="authBtn">دخول</button>
      <div class="auth-error" id="authError"></div>
      <div class="auth-hint" id="authSwitch">ما عندك حساب؟ <b class="switch-link">أنشئ حساب جديد</b></div>
    </div>
  </div>

  <!-- ============ FRIENDS LIST ============ -->
  <div id="screen-friends" class="screen">
    <div class="top-bar">
      <div class="title-block">
        <span class="brand-dot"></span>
        <h1>chat</h1>
      </div>
      <button class="icon-btn" id="logoutBtn" title="خروج">⏻</button>
    </div>
    <div class="me-chip" style="padding:0 20px 14px;">مسجل باسم: <b id="meName" style="color:var(--text)"></b></div>
    <div class="search-row">
      <input id="newFriendInput" type="text" placeholder="اسم صديق جديد...">
      <button id="startChatBtn">فتح</button>
    </div>
    <div class="friends-scroll" id="friendsScroll">
      <div class="empty-note">ما عندك محادثات بعد.<br>اكتب اسم صديقك بالأعلى وابدأ أول محادثة.</div>
    </div>
  </div>

  <!-- ============ CHAT ============ -->
  <div id="screen-chat" class="screen">
    <div class="chat-top">
      <button class="back-icon" id="backBtn">→</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div class="who">
        <h3 id="chatName"></h3>
        <span>متصل الآن</span>
      </div>
      <button class="call-icon" id="callIcon" title="مكالمة فيديو">📹</button>
    </div>
    <div class="messages" id="messagesEl"></div>
    <div class="composer">
      <button class="mic-btn" id="micBtn" title="تسجيل صوتي">🎤</button>
      <input id="msgInput" type="text" placeholder="اكتب رسالة...">
      <button id="sendBtn">↑</button>
    </div>
  </div>

  <!-- ============ INCOMING CALL MODAL ============ -->
  <div id="incomingCall">
    <div class="avatar" id="incomingAvatar">?</div>
    <h3 id="incomingName"></h3>
    <p>مكالمة فيديو واردة...</p>
    <div class="incoming-actions">
      <button class="call-btn end" id="declineCallBtn">✕</button>
      <button class="call-btn accept" id="acceptCallBtn">📹</button>
    </div>
  </div>

  <!-- ============ VIDEO CALL OVERLAY ============ -->
  <div id="callOverlay">
    <div class="call-status" id="callStatus">جارِ الاتصال...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-controls">
      <button class="call-btn end" id="endCallBtn">✕</button>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://roqpinipcgwqeqqfpcjm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = '';
let currentReceiver = '';
let friends = [];
let isSignupMode = false;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function initials(name){ return (name || '?').trim().charAt(0).toUpperCase(); }
function showAuthError(msg){ document.getElementById('authError').innerText = msg || ''; }

/* ---------------- Auth mode toggle ---------------- */
function toggleAuthMode(){
  isSignupMode = !isSignupMode;
  document.getElementById('authTitle').innerText = isSignupMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
  document.getElementById('authBtn').innerText = isSignupMode ? 'تسجيل حساب' : 'دخول';
  document.getElementById('authSwitch').innerHTML = isSignupMode
    ? 'لديك حساب بالفعل؟ <b class="switch-link">تسجيل الدخول</b>'
    : 'ما عندك حساب؟ <b class="switch-link">أنشئ حساب جديد</b>';
  showAuthError('');
}
// تفويض الحدث (event delegation) بدل الاعتماد على عنصر معين قد يُستبدل بالـ innerHTML
document.getElementById('authSwitch').addEventListener('click', (e) => {
  if(e.target.classList.contains('switch-link')) toggleAuthMode();
});

/* ---------------- Auth submit ---------------- */
// Supabase Auth يتطلب إيميل تقنيًا بصيغة ASCII صالحة، فنحوّل اسم المستخدم
// (حتى لو بالعربي) لرمز ثابت بالإنجليزي بدل الاعتماد على الأحرف نفسها
function hashUsername(str){
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  }
  return hash.toString(16);
}
function usernameToPseudoEmail(username){
  const key = username.trim().toLowerCase();
  return 'user' + hashUsername(key) + '@chatapp.local';
}

document.getElementById('authBtn').onclick = async () => {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  showAuthError('');
  if(!username || !password){ showAuthError('اكتب اسم المستخدم وكلمة المرور'); return; }

  const pseudoEmail = usernameToPseudoEmail(username);

  if(isSignupMode){
    const { data, error } = await supabaseClient.auth.signUp({ email: pseudoEmail, password });
    if(error){
      showAuthError(error.message.includes('already') ? 'اسم المستخدم هذا محجوز، جرب اسم ثاني' : error.message);
      return;
    }
    const userId = data.user?.id;
    if(userId){
      const { error: profErr } = await supabaseClient.from('profiles').insert([{ id: userId, username }]);
      if(profErr){ showAuthError('اسم المستخدم هذا محجوز، جرب اسم ثاني'); return; }
    }
    currentUser = username;
    enterApp();
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: pseudoEmail, password });
    if(error){ showAuthError('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
    const { data: profile, error: profErr } = await supabaseClient
      .from('profiles').select('username').eq('id', data.user.id).single();
    if(profErr || !profile){ showAuthError('ما لقينا اسم مستخدم مرتبط بهذا الحساب'); return; }
    currentUser = profile.username;
    enterApp();
  }
};

function enterApp(){
  document.getElementById('meName').innerText = currentUser;
  showScreen('screen-friends');
  loadExistingChats();
  subscribeToRealtime();
  subscribeToCallSignaling();
}

document.getElementById('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  currentUser = '';
  friends = [];
  document.getElementById('usernameInput').value = '';
  document.getElementById('passwordInput').value = '';
  showScreen('screen-auth');
};

(async () => {
  const { data } = await supabaseClient.auth.getSession();
  if(data.session){
    const { data: profile } = await supabaseClient
      .from('profiles').select('username').eq('id', data.session.user.id).single();
    if(profile){ currentUser = profile.username; enterApp(); }
  }
})();

/* ---------------- Friends list ---------------- */
document.getElementById('startChatBtn').onclick = () => {
  const name = document.getElementById('newFriendInput').value.trim();
  if(!name || name === currentUser){ alert('اكتب اسم صديق صالح'); return; }
  if(!friends.includes(name)) friends.push(name);
  document.getElementById('newFriendInput').value = '';
  openChat(name);
};

async function loadExistingChats(){
  const { data, error } = await supabaseClient
    .from('message').select('sender, receiver')
    .or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);
  if(!error && data){
    data.forEach(m => {
      const other = m.sender === currentUser ? m.receiver : m.sender;
      if(other && !friends.includes(other)) friends.push(other);
    });
    renderFriends();
  }
}

function renderFriends(){
  const el = document.getElementById('friendsScroll');
  el.innerHTML = '';
  if(friends.length === 0){
    el.innerHTML = '<div class="empty-note">ما عندك محادثات بعد.<br>اكتب اسم صديقك بالأعلى وابدأ أول محادثة.</div>';
    return;
  }
  friends.forEach(f => {
    const row = document.createElement('div');
    row.className = 'friend-row';
    row.innerHTML = `
      <div class="avatar">${initials(f)}</div>
      <div class="friend-meta">
        <div class="name">${f}</div>
        <div class="preview">اضغط لفتح المحادثة</div>
      </div>`;
    row.onclick = () => openChat(f);
    el.appendChild(row);
  });
}

/* ---------------- Chat screen ---------------- */
function openChat(friend){
  currentReceiver = friend;
  document.getElementById('chatName').innerText = friend;
  document.getElementById('chatAvatar').innerText = initials(friend);
  showScreen('screen-chat');
  loadMessages();
}

document.getElementById('backBtn').onclick = () => {
  currentReceiver = '';
  showScreen('screen-friends');
  loadExistingChats();
};

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentReceiver) return;
  input.value = '';
  const { error } = await supabaseClient.from('message').insert([{ sender: currentUser, receiver: currentReceiver, text }]);
  if(error) alert('خطأ في الإرسال: ' + error.message);
}
document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });

/* ---------------- Voice messages ---------------- */
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

async function toggleRecording(){
  if(!currentReceiver) return;

  if(!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm')
        ? 'audio/webm'
        : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      recordedChunks = [];

      mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const base64 = await blobToBase64(blob);
        const { error } = await supabaseClient
          .from('message')
          .insert([{ sender: currentUser, receiver: currentReceiver, text: 'VOICE::' + base64 }]);
        if(error) alert('خطأ بإرسال الرسالة الصوتية: ' + error.message);
      };

      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
    } catch(e){
      alert('ما قدرنا نوصل للمايكروفون. تأكد من إعطاء الإذن.');
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  }
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

document.getElementById('micBtn').onclick = toggleRecording;

async function loadMessages(){
  const { data, error } = await supabaseClient
    .from('message').select('*')
    .or(`and(sender.eq.${currentUser},receiver.eq.${currentReceiver}),and(sender.eq.${currentReceiver},receiver.eq.${currentUser})`)
    .order('created_at', { ascending: true });
  const box = document.getElementById('messagesEl');
  box.innerHTML = '';
  if(!error && data) data.forEach(appendMessage);
}

function appendMessage(msg){
  const relevant =
    (msg.sender === currentUser && msg.receiver === currentReceiver) ||
    (msg.sender === currentReceiver && msg.receiver === currentUser);
  if(!relevant) return;
  const box = document.getElementById('messagesEl');
  const div = document.createElement('div');
  div.className = 'bubble ' + (msg.sender === currentUser ? 'me' : 'them');

  if(msg.text && msg.text.startsWith('VOICE::')){
    const base64 = msg.text.slice('VOICE::'.length);
    div.classList.add('voice-bubble');
    div.innerHTML = `🎤 <audio controls src="data:audio/webm;base64,${base64}"></audio>`;
  } else {
    div.innerText = msg.text;
  }

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function subscribeToRealtime(){
  supabaseClient
    .channel('public:message')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'message' }, payload => appendMessage(payload.new))
    .subscribe();
}

/* =========================================================================
   VIDEO CALLING (WebRTC + Supabase Realtime Broadcast for signaling)
   ========================================================================= */
const RTC_CONFIG = {
  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
};

let myInboxChannel = null;  // listens for signals addressed to me
let peerConnection = null;
let localStream = null;
let callPeerName = '';      // the friend I'm currently in a call with

function subscribeToCallSignaling(){
  if(myInboxChannel) supabaseClient.removeChannel(myInboxChannel);
  myInboxChannel = supabaseClient.channel('calls-' + currentUser);
  myInboxChannel
    .on('broadcast', { event: 'signal' }, ({ payload }) => handleIncomingSignal(payload))
    .subscribe();
}

function sendSignal(toUser, data){
  const ch = supabaseClient.channel('calls-' + toUser);
  ch.subscribe(status => {
    if(status === 'SUBSCRIBED'){
      ch.send({ type: 'broadcast', event: 'signal', payload: { ...data, from: currentUser } });
      setTimeout(() => supabaseClient.removeChannel(ch), 800);
    }
  });
}

async function handleIncomingSignal(payload){
  if(payload.kind === 'offer'){
    callPeerName = payload.from;
    document.getElementById('incomingAvatar').innerText = initials(payload.from);
    document.getElementById('incomingName').innerText = payload.from;
    document.getElementById('incomingCall').classList.add('active');
    window._pendingOffer = payload.sdp;
  }
  else if(payload.kind === 'answer'){
    if(peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    document.getElementById('callStatus').innerText = 'متصل الآن';
  }
  else if(payload.kind === 'candidate'){
    if(peerConnection && payload.candidate){
      try{ await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); }catch(e){}
    }
  }
  else if(payload.kind === 'hangup'){
    endCall(false);
  }
}

async function startCall(toUser){
  callPeerName = toUser;
  document.getElementById('callOverlay').classList.add('active');
  document.getElementById('callStatus').innerText = 'جارِ الاتصال بـ ' + toUser + '...';

  localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  document.getElementById('localVideo').srcObject = localStream;

  peerConnection = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

  peerConnection.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
  };
  peerConnection.onicecandidate = e => {
    if(e.candidate) sendSignal(toUser, { kind:'candidate', candidate: e.candidate });
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  sendSignal(toUser, { kind:'offer', sdp: offer });
}

async function acceptCall(){
  document.getElementById('incomingCall').classList.remove('active');
  document.getElementById('callOverlay').classList.add('active');
  document.getElementById('callStatus').innerText = 'متصل الآن';

  localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  document.getElementById('localVideo').srcObject = localStream;

  peerConnection = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

  peerConnection.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
  peerConnection.onicecandidate = e => {
    if(e.candidate) sendSignal(callPeerName, { kind:'candidate', candidate: e.candidate });
  };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(window._pendingOffer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  sendSignal(callPeerName, { kind:'answer', sdp: answer });
}

function declineCall(){
  document.getElementById('incomingCall').classList.remove('active');
  sendSignal(callPeerName, { kind:'hangup' });
  callPeerName = '';
}

function endCall(notifyPeer = true){
  if(notifyPeer && callPeerName) sendSignal(callPeerName, { kind:'hangup' });
  if(peerConnection){ peerConnection.close(); peerConnection = null; }
  if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('callOverlay').classList.remove('active');
  document.getElementById('incomingCall').classList.remove('active');
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  callPeerName = '';
}

document.getElementById('callIcon').onclick = () => {
  if(!currentReceiver) return;
  startCall(currentReceiver);
};
document.getElementById('acceptCallBtn').onclick = acceptCall;
document.getElementById('declineCallBtn').onclick = declineCall;
document.getElementById('endCallBtn').onclick = () => endCall(true);
</script>
