<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المؤمنون - سيدي يوسف</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --accent-color: #eab308;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .box { background: var(--card-bg); border: 2px solid var(--accent-color); padding: 20px; border-radius: 14px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center; }
        
        h2 { color: var(--accent-color); margin-top: 0; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        
        button { width: 100%; padding: 14px; margin-top: 15px; border-radius: 8px; border: none; background: var(--accent-color); color: #000; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button:hover { filter: brightness(1.1); }
        
        .secondary-btn { background: #2563eb; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>بوصلة القبلة المباشرة</h2>
        <p id="qiblaSubInfo">اضغط على الزر لتحديد موقعك الجغرافي وتوجيه البوصلة فوراً نحو الكعبة.</p>
        
        <div style="margin: 25px 0;">
            <div id="compassRing" style="position: relative; width: 190px; height: 190px; margin: 0 auto; border: 6px double var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-color); box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: border-color 0.3s, box-shadow 0.3s;">
                
                <div id="qiblaArrow" style="position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; will-change: transform;">
                    <div id="qiblaIcon" style="font-size: 45px; margin-top: -90px; display: block; color: var(--accent-color); line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: color 0.3s;">▲</div>
                </div>
                
                <div style="font-size: 12px; color: var(--accent-color); font-weight: bold; background: rgba(15,23,42,0.85); padding: 4px 8px; border-radius: 4px;" id="compassCenterText">القبلة</div>
            </div>
        </div>

        <p id="qiblaStatusText" style="font-size: 13px; color: #cbd5e1; margin-bottom: 10px;">لم يتم تفعيل المستشعر بعد</p>
        
        <button onclick="initAutoQibla()" class="secondary-btn">📍 تحديد موقعي وتفعيل القبلة 🧭</button>
    </div>

    <script>
        let qiblaBearing = 0;
        let smoothedHeading = null;

        function initAutoQibla() {
            const statusText = document.getElementById("qiblaStatusText");
            const subInfo = document.getElementById("qiblaSubInfo");

            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم تحديد الموقع الجغرافي.");
                return;
            }

            statusText.textContent = "جاري تحديد موقعك بدقة عبر الـ GPS...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    calculateQibla(lat, lon);
                    subInfo.textContent = `تم رصد الموقع بنجاح (خط العرض: ${lat.toFixed(2)}, خط الطول: ${lon.toFixed(2)})`;
                    requestCompassPermission();
                },
                () => {
                    statusText.innerHTML = "<span style='color: #ef4444;'>تعذر تحديد الموقع. تأكد من تفعيل صلاحية الـ GPS.</span>";
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        function calculateQibla(lat, lon) {
            const kaabaLat = 21.4225;
            const kaabaLon = 39.8262;

            const phi1 = lat * Math.PI / 180;
            const phi2 = kaabaLat * Math.PI / 180;
            const deltaLambda = (kaabaLon - lon) * Math.PI / 180;

            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            
            let theta = Math.atan2(y, x);
            qiblaBearing = (theta * 180 / Math.PI + 360) % 360;
        }

        function requestCompassPermission() {
            const statusText = document.getElementById("qiblaStatusText");

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            statusText.textContent = "البوصلة نشطة وثابتة الآن.";
                        } else {
                            statusText.innerHTML = "<span style='color: #ef4444;'>تم رفض إذن مستشعر الاتجاه.</span>";
                        }
                    }).catch(console.error);
            } else if (window.addEventListener) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                statusText.textContent = "البوصلة نشطة وثابتة الآن.";
            } else {
                statusText.innerHTML = "<span style='color: #ef4444;'>متصفحك لا يدعم مستشعر البوصلة.</span>";
            }
        }

        function handleOrientation(event) {
            let heading = null;

            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha;
            }

            if (heading !== null) {
                // معالجة القفزات عند خط الصفر (360 -> 0) لمنع الدوران الوهمي
                if (smoothedHeading === null) {
                    smoothedHeading = heading;
                } else {
                    let diff = heading - smoothedHeading;
                    if (diff > 180) diff -= 360;
                    if (diff < -180) diff += 360;
                    // معامل تنعيم عالي لمنع أي ارتعاش أو اهتزاز للسهم
                    smoothedHeading += diff * 0.15;
                }

                let normalizedHeading = (smoothedHeading + 360) % 360;
                let finalRotation = (qiblaBearing - normalizedHeading + 360) % 360;
                
                const arrow = document.getElementById("qiblaArrow");
                const compassRing = document.getElementById("compassRing");
                const qiblaIcon = document.getElementById("qiblaIcon");
                const statusText = document.getElementById("qiblaStatusText");

                if (arrow) {
                    arrow.style.transform = `rotate(${finalRotation}deg)`;
                }

                let deviation = Math.min(finalRotation, 360 - finalRotation);
                
                if (deviation <= 4) {
                    compassRing.style.borderColor = "#ffffff";
                    compassRing.style.boxShadow = "0 0 25px rgba(255, 255, 255, 0.8)";
                    qiblaIcon.style.color = "#ffffff";
                    statusText.innerHTML = "<span style='color: #ffffff; font-weight: bold;'>✨ ممتاز! أنت تواجه القبلة تماماً ✨</span>";
                } else {
                    compassRing.style.borderColor = "var(--accent-color)";
                    compassRing.style.boxShadow = "0 0 20px rgba(0,0,0,0.5)";
                    qiblaIcon.style.color = "var(--accent-color)";
                    statusText.textContent = `وجّه هاتفك بثبات نحو الاتجاه (الانحراف: ${deviation.toFixed(0)}°)`;
                }
            }
        }
    </script>
</body>
</html>
