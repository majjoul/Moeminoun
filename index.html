<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق المراسلة الآمن</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#0b1120;
    --surface:#121a2e;
    --surface-2:#182238;
    --line:#22304d;
    --text:#e9edf6;
    --muted:#7c879d;
    --accent:#2dd4a8;
    --accent-dim:#1c9c7c;
    --danger:#ef4444;
    --bubble-me:#1e5a4c;
    --bubble-them:#1a2338;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    height:100%;
  }

  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }

  button,input{
    font-family:inherit;
  }

  .shell{
    width:100%;
    max-width:460px;
    height:100vh;
    max-height:900px;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  @media (min-width:500px){
    .shell{
      border-radius:22px;
      height:92vh;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
  }

  .screen{
    display:none;
    flex-direction:column;
    height:100%;
  }

  .screen.active{
    display:flex;
  }

  /* ================= BRAND ================= */

  .brand-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--accent);
    display:inline-block;
    box-shadow:0 0 0 4px rgba(45,212,168,.15);
  }

  /* ================= AUTH ================= */

  .auth-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:36px 30px;
    overflow-y:auto;
  }

  .auth-brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }

  .auth-brand span.name{
    font-size:22px;
    font-weight:800;
    letter-spacing:.5px;
  }

  .auth-wrap h1{
    font-size:26px;
    font-weight:800;
    margin:22px 0 6px;
  }

  .auth-wrap p.sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:20px;
  }

  .auth-tabs{
    display:flex;
    width:100%;
    margin-bottom:20px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:4px;
  }

  .auth-tab{
    flex:1;
    padding:10px;
    background:transparent;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    color:var(--muted);
  }

  .auth-tab.active{
    background:var(--accent);
    color:#04231c;
  }

  .field{
    margin-bottom:14px;
  }

  .field input{
    width:100%;
    padding:15px 16px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--text);
    font-size:15px;
    outline:none;
  }

  .field input:focus{
    border-color:var(--accent);
  }

  .field input::placeholder{
    color:#54607a;
  }

  .btn-primary{
    width:100%;
    padding:15px;
    background:var(--accent);
    color:#04231c;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
  }

  .auth-hint{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:18px;
  }

  /* ================= FRIENDS ================= */

  .top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 20px 14px;
  }

  .top-bar .title-block{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .top-bar h1{
    font-size:24px;
    font-weight:800;
  }

  .me-chip{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }

  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--muted);
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
  }

  .icon-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  .search-row{
    display:flex;
    gap:10px;
    padding:0 20px 14px;
  }

  .search-row input{
    flex:1;
    padding:12px 16px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-size:14px;
    outline:none;
  }

  .search-row button{
    padding:0 18px;
    background:var(--accent);
    color:#04231c;
    border:none;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }

  .friends-scroll{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 12px;
  }

  .friend-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 12px;
    border-radius:16px;
    cursor:pointer;
  }

  .friend-row:hover{
    background:var(--surface-2);
  }

  .avatar{
    width:50px;
    height:50px;
    border-radius:16px;
    background:linear-gradient(145deg,var(--accent-dim),var(--accent));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:18px;
    color:#04231c;
    flex-shrink:0;
  }

  .friend-meta{
    flex:1;
    min-width:0;
  }

  .friend-meta .name{
    font-weight:700;
    font-size:15.5px;
    margin-bottom:3px;
  }

  .friend-meta .preview{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:60px 30px;
    line-height:1.7;
  }

  /* ================= CHAT ================= */

  .chat-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px;
    border-bottom:1px solid var(--line);
  }

  .chat-left-info{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .chat-top .avatar{
    width:40px;
    height:40px;
    font-size:15px;
    border-radius:12px;
  }

  .chat-top .who h3{
    font-size:16px;
    font-weight:700;
  }

  .chat-top .who span{
    font-size:12px;
    color:var(--accent);
  }

  .chat-actions{
    display:flex;
    gap:8px;
  }

  .back-icon{
    background:none;
    border:none;
    color:var(--text);
    font-size:20px;
    cursor:pointer;
    padding:4px;
  }

  /* ================= VIDEO ================= */

  #video-container{
    display:none;
    position:relative;
    width:100%;
    height:300px;
    background:#000;
    overflow:hidden;
  }

  #remoteVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
  }

  #localVideo{
    position:absolute;
    bottom:12px;
    left:12px;
    width:90px;
    height:125px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid var(--accent);
    background:#111;
    z-index:2;
  }

  .call-controls{
    position:absolute;
    bottom:12px;
    right:12px;
    display:flex;
    gap:8px;
    z-index:5;
  }

  .call-control{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.65);
    color:white;
    cursor:pointer;
    font-size:16px;
  }

  .call-control.active{
    background:var(--accent);
    color:#04231c;
  }

  .call-control.end{
    background:var(--danger);
    border-color:var(--danger);
  }

  /* ================= MESSAGES ================= */

  .messages{
    flex:1;
    overflow-y:auto;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .bubble{
    max-width:74%;
    padding:11px 15px;
    border-radius:18px;
    font-size:14.5px;
    line-height:1.45;
    word-wrap:break-word;
  }

  .bubble.me{
    align-self:flex-start;
    background:var(--bubble-me);
    border-bottom-left-radius:5px;
    color:#eafff7;
  }

  .bubble.them{
    align-self:flex-end;
    background:var(--bubble-them);
    border-bottom-right-radius:5px;
  }

  .composer{
    display:flex;
    gap:10px;
    padding:14px;
    border-top:1px solid var(--line);
  }

  .composer input{
    flex:1;
    padding:13px 18px;
    border-radius:24px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:14.5px;
    outline:none;
  }

  .composer button{
    width:46px;
    height:46px;
    border-radius:50%;
    background:var(--accent);
    color:#04231c;
    border:none;
    font-size:18px;
    cursor:pointer;
  }

  /* ================= INCOMING CALL ================= */

  #incomingCall{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(5,10,20,.88);
    backdrop-filter:blur(8px);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:25px;
  }

  .incoming-box{
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }

  .incoming-avatar{
    width:80px;
    height:80px;
    border-radius:24px;
    background:linear-gradient(145deg,var(--accent-dim),var(--accent));
    color:#04231c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:800;
    margin:0 auto 16px;
  }

  .incoming-box h2{
    font-size:20px;
    margin-bottom:5px;
  }

  .incoming-box p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:24px;
  }

  .incoming-actions{
    display:flex;
    gap:10px;
  }

  .incoming-actions button{
    flex:1;
    padding:13px;
    border:none;
    border-radius:13px;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
  }

  #acceptCallBtn{
    background:var(--accent);
    color:#04231c;
  }

  #rejectCallBtn{
    background:var(--danger);
    color:white;
  }

  /* ================= STATUS ================= */

  #callStatus{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.65);
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    z-index:10;
    display:none;
  }
</style>
</head>

<body>

<div class="shell">

  <!-- ================= AUTH ================= -->

  <div id="screen-auth" class="screen active">

    <div class="auth-wrap">

      <div class="auth-brand">
        <span class="brand-dot"></span>
        <span class="name">chat</span>
      </div>

      <h1 id="authHeading">مرحباً بك</h1>

      <p class="sub" id="authSub">
        اكتب اسمك وكلمة المرور للدخول
      </p>

      <div class="auth-tabs">

        <button
          class="auth-tab active"
          id="tabLogin"
          onclick="switchAuthMode('login')">
          تسجيل دخول
        </button>

        <button
          class="auth-tab"
          id="tabSignup"
          onclick="switchAuthMode('signup')">
          حساب جديد
        </button>

      </div>

      <div class="field">
        <input
          id="usernameInput"
          type="text"
          placeholder="اسم المستخدم (مثال: yosef)"
          autocomplete="username">
      </div>

      <div class="field">
        <input
          id="passwordInput"
          type="password"
          placeholder="كلمة المرور الخاصة بك"
          autocomplete="current-password">
      </div>

      <button class="btn-primary" id="authBtn">
        دخول
      </button>

      <div class="auth-hint" id="authHint">
        ادخل بنفس الاسم وكلمة المرور دائماً
      </div>

    </div>
  </div>


  <!-- ================= FRIENDS ================= -->

  <div id="screen-friends" class="screen">

    <div class="top-bar">

      <div class="title-block">
        <span class="brand-dot"></span>
        <h1>chat</h1>
      </div>

      <button
        class="icon-btn"
        id="logoutBtn"
        title="خروج">
        ⏻
      </button>

    </div>

    <div
      class="me-chip"
      style="padding:0 20px 14px;">
      المستخدم الحالي:
      <b
        id="meName"
        style="color:var(--text)">
      </b>
    </div>

    <div class="search-row">

      <input
        id="newFriendInput"
        type="text"
        placeholder="اسم صديق جديد...">

      <button id="startChatBtn">
        فتح
      </button>

    </div>

    <div
      class="friends-scroll"
      id="friendsScroll">

      <div class="empty-note">
        ما عندك محادثات بعد.<br>
        اكتب اسم صديقك بالأعلى وابدأ أول محادثة.
      </div>

    </div>

  </div>


  <!-- ================= CHAT ================= -->

  <div id="screen-chat" class="screen">

    <div class="chat-top">

      <div class="chat-left-info">

        <button
          class="back-icon"
          id="backBtn">
          →
        </button>

        <div
          class="avatar"
          id="chatAvatar">
          ?
        </div>

        <div class="who">

          <h3 id="chatName"></h3>

          <span>
            متصل الآن
          </span>

        </div>

      </div>

      <div class="chat-actions">

        <button
          class="icon-btn"
          id="audioCallBtn"
          title="مكالمة صوتية">
          📞
        </button>

        <button
          class="icon-btn"
          id="videoCallBtn"
          title="مكالمة فيديو">
          📹
        </button>

      </div>

    </div>


    <!-- ================= VIDEO CALL ================= -->

    <div id="video-container">

      <div id="callStatus">
        جاري الاتصال...
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <video
        id="localVideo"
        autoplay
        playsinline
        muted>
      </video>

      <div class="call-controls">

        <button
          class="call-control"
          id="muteBtn"
          title="كتم المايك">
          🎤
        </button>

        <button
          class="call-control"
          id="cameraBtn"
          title="إيقاف الكاميرا">
          📷
        </button>

        <button
          class="call-control end"
          id="endCallBtn"
          title="إنهاء المكالمة">
          ☎
        </button>

      </div>

    </div>


    <!-- ================= MESSAGES ================= -->

    <div
      class="messages"
      id="messagesEl">
    </div>


    <!-- ================= COMPOSER ================= -->

    <div class="composer">

      <input
        id="msgInput"
        type="text"
        placeholder="اكتب رسالة...">

      <button id="sendBtn">
        ↑
      </button>

    </div>

  </div>


  <!-- ================= INCOMING CALL ================= -->

  <div id="incomingCall">

    <div class="incoming-box">

      <div
        class="incoming-avatar"
        id="incomingAvatar">
        ?
      </div>

      <h2 id="incomingName">
        شخص ما
      </h2>

      <p>
        يتصل بك عبر الفيديو
      </p>

      <div class="incoming-actions">

        <button id="rejectCallBtn">
          رفض
        </button>

        <button id="acceptCallBtn">
          قبول
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  'https://roqpinipcgwqeqqfpcjm.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUsername = '';
let currentReceiver = '';
let friends = [];
let isSignUp = false;


/* =========================================================
   WEBRTC STATE
========================================================= */

let peerConnection = null;

let localStream = null;

let signalChannel = null;

let currentCallId = null;

let incomingCallData = null;


/*
  STUN servers.

  ملاحظة:
  هذه تساعد WebRTC على اكتشاف المسار بين الجهازين.
  للإنتاج تحتاج TURN server أيضاً.
*/

const rtcConfig = {

  iceServers: [

    {
      urls: 'stun:stun.l.google.com:19302'
    },

    {
      urls: 'stun:stun1.l.google.com:19302'
    }

  ]

};


/* =========================================================
   DOM READY
========================================================= */

window.addEventListener(
  'DOMContentLoaded',
  async () => {

    const savedUser =
      localStorage.getItem(
        'chat_current_user'
      );

    if(savedUser){

      currentUsername =
        savedUser;

      document.getElementById(
        'meName'
      ).innerText =
        currentUsername;

      showScreen(
        'screen-friends'
      );

      await loadExistingChats();

      await subscribeToRealtime();

      await subscribeToCallSignals();

      requestNotificationPermission();
    }

  }
);


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id){

  document
    .querySelectorAll('.screen')
    .forEach(
      s =>
        s.classList.remove(
          'active'
        )
    );

  document
    .getElementById(id)
    .classList.add('active');

}


/* =========================================================
   INITIALS
========================================================= */

function initials(name){

  return (
    name ||
    '?'
  )
  .trim()
  .charAt(0)
  .toUpperCase();

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function requestNotificationPermission(){

  if(
    window.Notification &&
    Notification.permission !== 'granted'
  ){

    Notification.requestPermission();

  }

}


/* =========================================================
   AUTH MODE
========================================================= */

function switchAuthMode(mode){

  isSignUp =
    mode === 'signup';

  const heading =
    document.getElementById(
      'authHeading'
    );

  const sub =
    document.getElementById(
      'authSub'
    );

  const btn =
    document.getElementById(
      'authBtn'
    );

  const tabLogin =
    document.getElementById(
      'tabLogin'
    );

  const tabSignup =
    document.getElementById(
      'tabSignup'
    );


  if(isSignUp){

    heading.innerText =
      'حساب جديد';

    sub.innerText =
      'اختر اسماً وكلمة مرور خاصة بك';

    btn.innerText =
      'تسجيل وحفظ';

    tabSignup.classList.add(
      'active'
    );

    tabLogin.classList.remove(
      'active'
    );

  }else{

    heading.innerText =
      'مرحباً بك';

    sub.innerText =
      'اكتب اسمك وكلمة المرور للدخول';

    btn.innerText =
      'دخول';

    tabLogin.classList.add(
      'active'
    );

    tabSignup.classList.remove(
      'active'
    );

  }

}


/* =========================================================
   LOGIN / SIGNUP
========================================================= */

document
  .getElementById('authBtn')
  .onclick = async () => {

    const username =
      document
        .getElementById(
          'usernameInput'
        )
        .value
        .trim();

    const password =
      document
        .getElementById(
          'passwordInput'
        )
        .value
        .trim();


    if(
      !username ||
      !password
    ){

      alert(
        'الرجاء إدخال اسم المستخدم وكلمة المرور'
      );

      return;

    }


    requestNotificationPermission();


    if(isSignUp){

      const {
        data: existing
      } =
        await supabaseClient
          .from('profiles')
          .select('username')
          .eq(
            'username',
            username
          )
          .maybeSingle();


      if(existing){

        alert(
          'اسم المستخدم هذا مستخدم مسبقاً.'
        );

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from('profiles')
          .insert([
            {
              username:
                username,

              password:
                password
            }
          ]);


      if(error){

        alert(
          'خطأ في إنشاء الحساب: ' +
          error.message
        );

        return;

      }


      loginSuccess(
        username
      );


    }else{

      const {
        data,
        error
      } =
        await supabaseClient
          .from('profiles')
          .select('*')
          .eq(
            'username',
            username
          )
          .eq(
            'password',
            password
          )
          .maybeSingle();


      if(
        error ||
        !data
      ){

        alert(
          'اسم المستخدم أو كلمة المرور غير صحيحة!'
        );

/* =========================================================
   LOAD CHATS
========================================================= */

async function loadExistingChats(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from('message')
      .select(
        'sender,receiver'
      )
      .or(
        `sender.eq.${currentUsername},receiver.eq.${currentUsername}`
      );


  if(
    !error &&
    data
  ){

    data.forEach(
      m => {

        const other =
          m.sender ===
          currentUsername
            ? m.receiver
            : m.sender;


        if(
          other &&
          !friends.includes(
            other
          )
        ){

          friends.push(
            other
          );

        }

      }
    );

  }


  renderFriends();

}


/* =========================================================
   RENDER FRIENDS
========================================================= */

function renderFriends(){

  const el =
    document.getElementById(
      'friendsScroll'
    );


  el.innerHTML = '';


  if(
    friends.length === 0
  ){

    el.innerHTML =
      `
      <div class="empty-note">
        ما عندك محادثات بعد.<br>
        اكتب اسم صديقك بالأعلى وابدأ أول محادثة.
      </div>
      `;

    return;

  }


  friends.forEach(
    f => {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'friend-row';


      row.innerHTML =
        `
        <div class="avatar">
          ${initials(f)}
        </div>

        <div class="friend-meta">

          <div class="name">
            ${escapeHtml(f)}
          </div>

          <div class="preview">
            اضغط لفتح المحادثة
          </div>

        </div>

      row.onclick =
        () =>
          openChat(f);


      el.appendChild(
        row
      );

    }
  );

}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from('message')
      .select('*')
      .or(
        `and(sender.eq.${currentUsername},receiver.eq.${currentReceiver}),and(sender.eq.${currentReceiver},receiver.eq.${currentUsername})`
      )
      .order(
        'created_at',
        {
          ascending:true
        }
      );


  const box =
    document.getElementById(
      'messagesEl'
    );

  box.innerHTML = '';


  if(
    !error &&
    data
  ){

    data.forEach(
      appendMessage
    );

  }

}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessage(msg){

  const relevant =
    (
      msg.sender ===
      currentUsername &&
      msg.receiver ===
      currentReceiver
    )
    ||
    (
      msg.sender ===
      currentReceiver &&
      msg.receiver ===
      currentUsername
    );


  if(!relevant)
    return;


  const box =
    document.getElementById(
      'messagesEl'
    );


  const div =
    document.createElement(
      'div'
    );


  div.className =
    'bubble ' +
    (
      msg.sender ===
      currentUsername
        ? 'me'
        : 'them'
    );


  div.innerText =
    msg.text;


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;

}


/* =========================================================
   MESSAGE REALTIME
========================================================= */

async function subscribeToRealtime(){

  supabaseClient
    .channel(
      'public-message-' +
      currentUsername
    )
    .on(
      'postgres_changes',
      {
        event:'INSERT',
        schema:'public',
        table:'message'
      },
      payload => {

        const msg =
          payload.new;


        appendMessage(
          msg
        );


        if(
          msg.receiver ===
          currentUsername
        ){

          if(
            !friends.includes(
              msg.sender
            )
          ){

            friends.push(
              msg.sender
            );

            renderFriends();

          }


          if(
            window.Notification &&
            Notification.permission ===
              'granted'
          ){

            new Notification(
              `رسالة جديدة من: ${msg.sender}`,
              {
                body:msg.text
              }
            );

          }

        }

      }
    )
    .subscribe();

}


/* =========================================================
   WEBRTC SIGNAL CHANNEL
=========================================================

   لكل مستخدم قناة خاصة:

   signal:username

   يتم استخدامها فقط لتبادل:

   - offer
   - answer
   - ICE candidates
   - hangup

========================================================= */

async function subscribeToCallSignals(){

  if(!currentUsername)
    return;


  if(signalChannel){

    await supabaseClient
      .removeChannel(
        signalChannel
      );

  }


  signalChannel =
    supabaseClient
      .channel(
        'signal:' +
        currentUsername
      )
      .on(
        'broadcast',
        {
          event:'call-signal'
        },
        async ({
          payload
        }) => {

          await handleSignal(
            payload
          );

        }
      )
      .subscribe();

}


/* =========================================================
   SEND SIGNAL
========================================================= */

async function sendSignal(
  targetUser,
  data
){

  const targetChannel =
    supabaseClient
      .channel(
        'signal:' +
        targetUser
      );


  await targetChannel.subscribe();


  await targetChannel.send({
    type:'broadcast',
    event:'call-signal',
    payload:{
      ...data,
      from:
        currentUsername
    }
  });


  /*
    لا نحذف القناة فوراً في حالة كان الطرف الآخر
    يحتاج الرسالة؟ Supabase Broadcast يرسلها فوراً.
  */

  setTimeout(
    async () => {

      try{

        await supabaseClient
          .removeChannel(
            targetChannel
          );

      }catch(e){}

    },
    1000
  );

}


/* =========================================================
   HANDLE SIGNAL
========================================================= */

async function handleSignal(
  data
){

  if(!data)
    return;


  if(
    data.from ===
    currentUsername
  ){

    return;

  }


  /* ---------------- OFFER ---------------- */

  if(
    data.type ===
    'offer'
  ){

    /*
      إذا عندنا مكالمة حالية،
      نرفض العرض الجديد.
    */

    if(peerConnection){

      await sendSignal(
        data.from,
        {
          type:'busy',
          callId:data.callId
        }
      );

      return;

    }


    incomingCallData =
      data;


    document.getElementById(
      'incomingName'
    ).innerText =
      data.from;


    document.getElementById(
      'incomingAvatar'
    ).innerText =
      initials(data.from);


    document.getElementById(
      'incomingCall'
    ).style.display =
      'flex';


    return;

  }


  /* ---------------- ANSWER ---------------- */

  if(
    data.type ===
    'answer'
  ){

    if(
      !peerConnection ||
      data.callId !==
        currentCallId
    ){

      return;

    }


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );


    setCallStatus(
      'متصل'
    );

    return;

  }


  /* ---------------- ICE ---------------- */

  if(
    data.type ===
    'ice'
  ){

    if(
      !peerConnection ||
      data.callId !==
        currentCallId
    ){

      return;

    }


    try{

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

    }catch(error){

      console.warn(
        'ICE candidate error',
        error
      );

    }

    return;

  }


  /* ---------------- HANGUP ---------------- */

  if(
    data.type ===
    'hangup'
  ){

    if(
      data.callId ===
      currentCallId
    ){

      await endCall(
        false
      );

      alert(
        'تم إنهاء مكالمة الفيديو'
      );

    }

    return;

  }


  /* ---------------- REJECT ---------------- */

  if(
    data.type ===
    'reject'
  ){

    if(
      data.callId ===
      currentCallId
    ){

      await endCall(
        false
      );

      alert(
        `${data.from} رفض المكالمة`
      );

    }

    return;

  }


  /* ---------------- BUSY ---------------- */

  if(
    data.type ===
    'busy'
  ){

    if(
      data.callId ===
      currentCallId
    ){

      await endCall(
        false
      );

      alert(
        `${data.from} مشغول حالياً`
      );

    }

  }

}


/* =========================================================
   CREATE PEER CONNECTION
========================================================= */

function createPeerConnection(
  otherUser,
  callId
){

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  currentCallId =
    callId;


  /*
    استقبال فيديو وصوت الطرف الآخر
  */

  peerConnection.ontrack =
    event => {

      const remoteVideo =
        document.getElementById(
          'remoteVideo'
        );


      if(
        remoteVideo.srcObject !==
        event.streams[0]
      ){

        remoteVideo.srcObject =
          event.streams[0];

      }

    };


  /*
    إرسال ICE candidates للطرف الآخر
  */

  peerConnection.onicecandidate =
    async event => {

      if(
        !event.candidate
      ){

        return;

      }


      await sendSignal(
        otherUser,
        {
          type:'ice',

          callId:
            callId,

          candidate:
            event.candidate
        }
      );

    };


  peerConnection.onconnectionstatechange =
    () => {

      const state =
        peerConnection
          .connectionState;


      if(
        state ===
        'connected'
      ){

        setCallStatus(
          'متصل'
        );

      }


      if(
        state ===
        'disconnected' ||
        state ===
        'failed' ||
        state ===
        'closed'
      ){

        setCallStatus(
          'انتهى الاتصال'
        );

      }

    };


  /*
    إضافة كاميرا ومايك المستخدم
  */

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection
            .addTrack(
              track,
              localStream
            );

        }
      );

  }


  return peerConnection;

}


/* =========================================================
   START VIDEO CALL
========================================================= */

document
  .getElementById('videoCallBtn')
  .onclick =
    startVideoCall;


async function startVideoCall(){

  if(
    !currentReceiver
  ){

    return;

  }


  if(peerConnection){

    return;

  }


  try{

    /*
      طلب الكاميرا والمايك
    */

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video:true,
          audio:true
        });


    showVideoUI();


    setCallStatus(
      'جاري الاتصال...'
    );


    /*
      إنشاء معرف فريد للمكالمة
    */

    const callId =
      crypto.randomUUID();


    currentCallId =
      callId;


    /*
      إنشاء PeerConnection
    */

    createPeerConnection(
      currentReceiver,
      callId
    );


    /*
      إنشاء offer
    */

    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    /*
      إرسال العرض للطرف الآخر
    */

    await sendSignal(
      currentReceiver,
      {
        type:'offer',

        callId:
          callId,

        offer:
          peerConnection
            .localDescription
      }
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      'تعذر تشغيل الكاميرا أو المايكروفون:\n' +
      error.message
    );


    await endCall(
      false
    );

  }

}


/* =========================================================
   ACCEPT INCOMING CALL
========================================================= */

document
  .getElementById(
    'acceptCallBtn'
  )
  .onclick =
    acceptIncomingCall;


async function acceptIncomingCall(){

  if(
    !incomingCallData
  ){

    return;

  }


  const data =
    incomingCallData;


  document.getElementById(
    'incomingCall'
  ).style.display =
    'none';


  incomingCallData =
    null;


  /*
    افتح محادثة المتصل
  */

  currentReceiver =
    data.from;


  if(
    !friends.includes(
      data.from
    )
  ){

    friends.push(
      data.from
    );

    renderFriends();

  }


  document.getElementById(
    'chatName'
  ).innerText =
    data.from;


  document.getElementById(
    'chatAvatar'
  ).innerText =
    initials(
      data.from
    );


  showScreen(
    'screen-chat'
  );


  try{

    /*
      تشغيل الكاميرا والمايك
    */

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video:true,
          audio:true
        });


    showVideoUI();


    setCallStatus(
      'جاري الاتصال...'
    );


    /*
      إنشاء PeerConnection
    */

    createPeerConnection(
      data.from,
      data.callId
    );


    /*
      وضع offer القادم
    */

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


    /*
      إنشاء answer
    */

    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    /*
      إرسال answer للمتصل
    */

    await sendSignal(
      data.from,
      {
        type:'answer',

        callId:
          data.callId,

        answer:
          peerConnection
            .localDescription
      }
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      'تعذر قبول مكالمة الفيديو:\n' +
      error.message
    );


    await endCall(
      false
    );

  }

}

/* =========================================================
   MUTE MICROPHONE
========================================================= */

document
  .getElementById('muteBtn')
  .onclick =
    toggleMute;


function toggleMute(){

  if(
    !localStream
  ){

    return;

  }


  const audioTracks =
    localStream.getAudioTracks();


  if(
    audioTracks.length === 0
  ){

    return;

  }


  const enabled =
    audioTracks[0].enabled;


  audioTracks.forEach(
    track => {

      track.enabled =
        !enabled;

    }
  );


  const btn =
    document.getElementById(
      'muteBtn'
    );


  if(enabled){

    btn.innerText =
      '🔇';

    btn.classList.add(
      'active'
    );

  }else{

    btn.innerText =
      '🎤';

    btn.classList.remove(
      'active'
    );

  }

}

  const videoTracks =

  if(

  ){

  const enabled =

    );

  }

}


/* =========================================================
   END CALL
========================================================= */

document
  .getElementById('endCallBtn')
  .onclick =
    () =>
      endCall(true);


async function endCall(
  notifyOther = true
){

  const otherUser =
    currentReceiver;

  const callId =
    currentCallId;


  /*
    إخبار الطرف الآخر
  */

  if(
    notifyOther &&
    otherUser &&
    callId
  ){

    try{

      await sendSignal(
        otherUser,
        {
          type:'hangup',

          callId:
            callId
        }
      );

    }catch(error){

      console.warn(
        error
      );

    }

  }


  /*
    إغلاق WebRTC
  */

  if(peerConnection){

    peerConnection.ontrack =
      null;

    peerConnection.onicecandidate =
      null;

    peerConnection.close();

    peerConnection =
      null;

  }


  /*
    إيقاف الكاميرا والمايك
  */

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream =
      null;

  }


  /*
    تنظيف الفيديو
  */

  const localVideo =
    document.getElementById(
      'localVideo'
    );

  const remoteVideo =
    document.getElementById(
      'remoteVideo'
    );


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  /*
    إخفاء نافذة الفيديو
  */

  document.getElementById(
    'video-container'
  ).style.display =
    'none';


  setCallStatus(
    ''
  );


  currentCallId =
    null;


  /*
    إعادة أزرار التحكم
  */

  document.getElementById(
    'muteBtn'
  ).innerText =
    '🎤';

  document.getElementById(
    'muteBtn'
  ).classList.remove(
    'active'
  );


  document.getElementById(
    'cameraBtn'
  ).innerText =
    '📷';

  document.getElementById(
    'cameraBtn'
  ).classList.remove(
    'active'
  );

}
