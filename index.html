<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مراسلة عصري</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --my-msg: #6366f1;
            --other-msg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 0;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .app-container {
                border-radius: 20px;
                height: 90vh;
            }
        }

        /* الشاشات */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* شاشة تسجيل الدخول */
        .auth-container {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        .auth-container h1 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .auth-container p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* شاشة الدردشة */
        .chat-header {
            padding: 15px 20px;
            background-color: #111827;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-left: 12px;
        }

        .chat-info h3 {
            font-size: 16px;
        }

        .chat-info span {
            font-size: 12px;
            color: #10b981; /* أخضر متصل */
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.my-message {
            background-color: var(--my-msg);
            color: white;
            align-self: flex-start; /* عشان اتجاه RTL */
            border-bottom-left-radius: 4px;
        }

        .message.other-message {
            background-color: var(--other-msg);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #111827;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            outline: none;
        }

        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .send-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- شاشة تسجيل الدخول -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <h1>مرحباً بك في Chatify</h1>
                <p>سجل دخولك وابدأ المراسلة الفورية</p>
                
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" placeholder="اكتب اسمك هنا...">
                </div>
                
                <button class="btn" onclick="login()">دخول للمحادثة</button>
            </div>
        </div>

        <!-- شاشة المحادثة -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <div class="avatar">غ</div>
                <div class="chat-info">
                    <h3 id="display-name">المستخدم</h3>
                    <span>متصل الآن</span>
                </div>
            </div>

            <div class="chat-messages" id="messages-container">
                <!-- الرسائل التجريبية -->
                <div class="message other-message">أهلاً بك! هذا تطبيق المراسلة الجديد الخاص بك.</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالتك..." onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">
                    ➤
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentUser = "";

        // دالة تسجيل الدخول البسيطة
        function login() {
            const usernameInput = document.getElementById('username').value.trim();
            if(usernameInput === "") {
                alert("الرجاء إدخال اسم المستخدم!");
                return;
            }
            
            currentUser = usernameInput;
            document.getElementById('display-name').innerText = currentUser;

            // إخفاء شاشة الدخول وإظهار شاشة الشات
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('chat-screen').classList.add('active');

            // استرجاع الرسائل المحفوظة لو موجودة
            loadMessages();
        }

        // إرسال رسالة
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if(text === "") return;

            appendMessage(text, 'my-message');
            input.value = "";

            // حفظ الرسالة في ذاكرة المتصفح (LocalStorage) عشان ما تنحذف لو حدثت الصفحة
            saveMessageToStorage(text, 'my-message');
        }

        // إضافة الرسالة للواجهة
        function appendMessage(text, className) {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);

            // النزول لأسفل الشات تلقائياً
            container.scrollTop = container.scrollHeight;
        }

        // إرسال عند الضغط على Enter
        function checkEnter(event) {
            if(event.key === 'Enter') {
                sendMessage();
            }
        }

        // حفظ في LocalStorage (كمرحلة أولى لحفظ البيانات محلياً)
        function saveMessageToStorage(text, className) {
            let messages = JSON.parse(localStorage.getItem('chat_messages')) || [];
            messages.push({ text, className });
            localStorage.setItem('chat_messages', JSON.stringify(messages));
        }

        // تحميل الرسائل المحفوظة مسبقاً
        function loadMessages() {
            let messages = JSON.parse(localStorage.getItem('chat_messages')) || [];
            const container = document.getElementById('messages-container');
            
            // مسح الرسائل القديمة المؤقتة إذا حابب، أو تركها
            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.className}`;
                msgDiv.innerText = msg.text;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
