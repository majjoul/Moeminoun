<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المراسلة الفورية العصري</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #0084ff;
            --primary-hover: #006dd9;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #65676b;
            --border-color: #e4e6eb;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            direction: rtl; 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 100%;
            max-width: 420px;
            height: 90vh;
            max-height: 750px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* شاشة تسجيل الدخول */
        #auth-screen {
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0084ff, #00c6ff);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 15px rgba(0,132,255,0.3);
        }

        #auth-screen h2 {
            margin-bottom: 8px;
            font-size: 24px;
            color: #1c1e21;
        }

        #auth-screen p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* العناصر المشتركة */
        input { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border: 1.5px solid var(--border-color); 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        input:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,132,255,0.1);
        }

        button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,132,255,0.2);
        }

        button:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* شاشة المحادثات الرئيسية */
        #chat-section { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            box-sizing: border-box;
        }

        .app-header {
            padding: 16px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-avatar {
            width: 40px;
            height: 40px;
            background: #e4e6eb;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: #f0f2f5;
            color: var(--text-main);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            box-shadow: none;
            margin: 0;
            padding: 0;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: #e4e6eb;
            transform: none;
        }

        /* قائمة الأصدقاء */
        #friends-section {
            padding: 15px 20px;
            overflow-y: auto;
            flex: 1;
        }

        #friends-section h4 {
            margin-top: 0;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .friend-item { 
            padding: 10px 14px; 
            background: #ffffff; 
            margin: 8px 0; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .friend-item:hover { 
            background: #f8f9fa; 
            border-color: #cbd3d9;
            transform: translateX(-3px);
        }

        .friend-info-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .friend-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        /* نافذة إضافة صديق (Modal) */
        #add-friend-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* شاشة المحادثة النشطة */
        #active-chat-box { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            box-sizing: border-box;
        }

        .chat-header {
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #chat-box { 
            flex: 1; 
            border: none; 
            overflow-y: scroll; 
            padding: 15px; 
            background: #f7f8fa; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
        }

        .message { 
            padding: 10px 14px; 
            border-radius: 14px; 
            background: #ffffff; 
            max-width: 75%; 
            align-self: flex-start; 
            text-align: right; 
            word-break: break-word; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            font-size: 14px;
            line-height: 1.4;
            border-bottom-right-radius: 4px;
        }

        .my-message { 
            background: #dcf8c6; 
            align-self: flex-end; 
            border-bottom-right-radius: 14px;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 12px 16px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input-area input {
            margin: 0;
            border-radius: 20px;
            background: #f0f2f5;
            border: none;
            padding: 10px 16px;
        }

        .chat-input-area button {
            width: auto;
            padding: 10px 18px;
            margin: 0;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- شاشة تسجيل الدخول -->
        <div id="auth-screen">
            <div class="auth-logo">💬</div>
            <h2>تطبيق المراسلة</h2>
            <p>أدخل اسم المستخدم للبدء في الدردشة الفورية</p>
            <input type="text" id="username" placeholder="اسم المستخدم...">
            <button onclick="login()">دخول للتطبيق 🚀</button>
        </div>

        <!-- الشاشة الرئيسية (قائمة الأصدقاء) -->
        <div id="chat-section">
            <div class="app-header">
                <div class="user-info">
                    <div class="mini-avatar" id="header-user-initial">U</div>
                    <div>
                        <h4 id="current-user" style="margin:0; font-size: 15px; color: #1c1e21;"></h4>
                        <span style="font-size: 11px; color: #28a745;">● متصل الآن</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="openAddModal()" title="إضافة صديق">➕</button>
                    <button class="icon-btn" onclick="location.reload()" title="تسجيل خروج">🚪</button>
                </div>
            </div>
            
            <div id="friends-section">
                <h4>المحادثات النشطة والأصدقاء</h4>
                <div id="friends-list" style="margin-top: 8px;"></div>
            </div>

            <!-- نافذة منبثقة لإضافة صديق -->
            <div id="add-friend-modal">
                <div class="modal-content">
                    <h3 style="margin-top: 0; font-size: 18px;">إضافة صديق جديد</h3>
                    <input type="text" id="new-friend-name" placeholder="اسم الصديق...">
                    <button onclick="startChatWithNewFriend()" style="background: #28a745; margin-top: 10px;">إضافة ومراسلة</button>
                    <button onclick="closeAddModal()" style="background: #6c757d; margin-top: 5px;">إلغاء</button>
                </div>
            </div>

            <!-- شاشة المحادثة النشطة -->
            <div id="active-chat-box">
                <div class="chat-header">
                    <button class="icon-btn" onclick="backToFriends()" style="width: 32px; height: 32px; font-size: 14px;">⬅</button>
                    <div class="friend-avatar" id="chat-avatar-mini" style="width: 35px; height: 35px; font-size: 14px;">?</div>
                    <h4 id="chat-with" style="margin: 0; font-size: 16px; color: #1c1e21;"></h4>
                </div>
                
                <div id="chat-box"></div>
                
                <div class="chat-input-area">
                    <input type="text" id="message-text" placeholder="اكتب رسالتك هنا..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://roqpinipcgwqeqqfpcjm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = '';
        let currentReceiver = '';
        let friends = [];

        function login() {
            currentUser = document.getElementById('username').value.trim();
            if (!currentUser) {
                alert('الرجاء إدخال اسم المستخدم!');
                return;
            }
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';
            document.getElementById('current-user').innerText = currentUser;
            document.getElementById('header-user-initial').innerText = currentUser.charAt(0).toUpperCase();
            
            loadExistingChats();
            subscribeToRealtime();
        }

        function openAddModal() {
            document.getElementById('add-friend-modal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('add-friend-modal').style.display = 'none';
        }

        function startChatWithNewFriend() {
            const friendName = document.getElementById('new-friend-name').value.trim();
            if (!friendName || friendName === currentUser) {
                alert('الرجاء إدخال اسم صديق صالح يختلف عن اسمك!');
                return;
            }
            
            if (!friends.includes(friendName)) {
                friends.push(friendName);
                renderFriends();
            }
            
            document.getElementById('new-friend-name').value = '';
            closeAddModal();
            openChat(friendName);
        }

        async function loadExistingChats() {
            const { data, error } = await supabaseClient
                .from('message')
                .select('sender, receiver')
                .or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);

            if (!error && data) {
                data.forEach(msg => {
                    let otherUser = msg.sender === currentUser ? msg.receiver : msg.sender;
                    if (otherUser && !friends.includes(otherUser)) {
                        friends.push(otherUser);
                    }
                });
                renderFriends();
            }
        }

        function renderFriends() {
            const listDiv = document.getElementById('friends-list');
            listDiv.innerHTML = '';
            if (friends.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 40px;"><p style="font-size: 32px; margin: 0 0 10px 0;">📭</p><p style="font-size: 14px;">لا توجد محادثات سابقة.<br>اضغط على زر (➕) فوق لإضافة صديق!</p></div>';
                return;
            }
            friends.forEach(friend => {
                const initial = friend.charAt(0).toUpperCase();
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.onclick = () => openChat(friend);
                div.innerHTML = `
                    <div class="friend-info-group">
                        <div class="friend-avatar">${initial}</div>
                        <div>
                            <strong style="font-size: 15px; color: #1c1e21; display: block;">${friend}</strong>
                            <span style="font-size: 12px; color: var(--text-muted);">انقر لفتح المحادثة</span>
                        </div>
                    </div>
                    <span style="color: var(--primary-color); font-size: 18px;">‹</span>
                `;
                listDiv.appendChild(div);
            });
        }

        function openChat(friend) {
            currentReceiver = friend;
            document.getElementById('chat-with').innerText = friend;
            document.getElementById('chat-avatar-mini').innerText = friend.charAt(0).toUpperCase();
            document.getElementById('friends-section').style.display = 'none';
            document.getElementById('active-chat-box').style.display = 'flex';
            loadMessages();
        }

        function backToFriends() {
            document.getElementById('active-chat-box').style.display = 'none';
            document.getElementById('friends-section').style.display = 'block';
            currentReceiver = '';
            loadExistingChats();
        }

        async function sendMessage() {
            const text = document.getElementById('message-text').value.trim();
            if (!text || !currentReceiver) return;

            const { error } = await supabaseClient
                .from('message')
                .insert([{ sender: currentUser, receiver: currentReceiver, text: text }]);

            if (error) {
                alert('خطأ في الإرسال: ' + error.message);
            } else {
                document.getElementById('message-text').value = '';
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('message')
                .select('*')
                .or(`and(sender.eq.${currentUser},receiver.eq.${currentReceiver}),and(sender.eq.${currentReceiver},receiver.eq.${currentUser})`)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('خطأ في تحميل الرسائل:', error.message);
                return;
            }

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    appendMessageToUI(msg);
                });
            }
        }

        function appendMessageToUI(msg) {
            if (
                (msg.sender === currentUser && msg.receiver === currentReceiver) ||
                (msg.sender === currentReceiver && msg.receiver === currentUser)
            ) {
                const chatBox = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = 'message' + (msg.sender === currentUser ? ' my-message' : '');
                div.innerHTML = `<strong>${msg.sender === currentUser ? 'أنا' : msg.sender}:</strong> ${msg.text}`;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function subscribeToRealtime() {
            supabaseClient
                .channel('public:message')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message' }, payload => {
                    appendMessageToUI(payload.new);
                })
                .subscribe();
        }
    </script>
</body>
</html>
