<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المراسلة الفورية</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #0084ff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #006dd9; }
        #chat-section { display: none; }
        #chat-box { height: 250px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 5px; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 5px; background: #e4e6eb; max-width: 80%; }
        .my-message { background: #dcf8c6; margin-right: auto; text-align: left; }
        .friend-item { padding: 8px; background: #e9ecef; margin: 5px 0; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .friend-item:hover { background: #dde2e6; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="container" id="auth-screen">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="ادخل اسم المستخدم الخاص بك">
        <button onclick="login()">دخول</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div class="container" id="chat-section">
        <h3>مرحباً، <span id="current-user" style="color: #0084ff;"></span></h3>
        
        <div style="border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 10px;">
            <h4>قائمة الأصدقاء</h4>
            <input type="text" id="new-friend-name" placeholder="اسم صديق جديد للإضافة">
            <button onclick="addFriend()" style="background: #28a745;">إضافة صديق ➕</button>
            <div id="friends-list" style="max-height: 120px; overflow-y: auto; margin-top: 5px;"></div>
        </div>

        <div id="active-chat-box" style="display:none;">
            <h4>المحادثة مع: <span id="chat-with" style="color: #28a745;"></span></h4>
            <div id="chat-box"></div>
            <input type="text" id="message-text" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendMessage()">إرسال ✈️</button>
            <button onclick="backToFriends()" style="background: #6c757d; margin-top: 5px;">العودة للأصدقاء</button>
        </div>
    </div>

    <script>
        // تم دمج بيانات الاتصال الخاصة بك هنا مباشرة
        const SUPABASE_URL = 'https://roqpinipcgwqeqqfpcjm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = '';
        let currentReceiver = '';
        let friends = [];

        function login() {
            currentUser = document.getElementById('username').value.trim();
            if (!currentUser) {
                alert('الرجاء إدخال اسم المستخدم!');
                return;
            }
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-section').style.display = 'block';
            document.getElementById('current-user').innerText = currentUser;
            
            loadFriends();
            subscribeToRealtime();
        }

        function addFriend() {
            const friendName = document.getElementById('new-friend-name').value.trim();
            if (!friendName || friendName === currentUser) {
                alert('الرجاء إدخال اسم صديق صالح!');
                return;
            }
            if (!friends.includes(friendName)) {
                friends.push(friendName);
                renderFriends();
                document.getElementById('new-friend-name').value = '';
            } else {
                alert('هذا الصديق موجود مسبقاً في القائمة!');
            }
        }

        function renderFriends() {
            const listDiv = document.getElementById('friends-list');
            listDiv.innerHTML = '';
            if (friends.length === 0) {
                listDiv.innerHTML = '<p style="color: #888; font-size: 14px;">لا يوجد أصدقاء مضافين حالياً.</p>';
                return;
            }
            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `<span>${friend}</span> <button style="width: auto; padding: 5px 10px; margin:0;" onclick="openChat('${friend}')">مراسلة</button>`;
                listDiv.appendChild(div);
            });
        }

        function openChat(friend) {
            currentReceiver = friend;
            document.getElementById('chat-with').innerText = friend;
            document.getElementById('active-chat-box').style.display = 'block';
            loadMessages();
        }

        function backToFriends() {
            document.getElementById('active-chat-box').style.display = 'none';
            currentReceiver = '';
        }

        async function sendMessage() {
            const text = document.getElementById('message-text').value.trim();
            if (!text) return;

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ sender: currentUser, receiver: currentReceiver, text: text }]);

            if (error) {
                alert('خطأ في الإرسال: ' + error.message);
            } else {
                document.getElementById('message-text').value = '';
            }
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            data.forEach(msg => {
                appendMessageToUI(msg);
            });
        }

        function appendMessageToUI(msg) {
            if (
                (msg.sender === currentUser && msg.receiver === currentReceiver) ||
                (msg.sender === currentReceiver && msg.receiver === currentUser)
            ) {
                const chatBox = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = 'message' + (msg.sender === currentUser ? ' my-message' : '');
                div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function subscribeToRealtime() {
            supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessageToUI(payload.new);
                })
                .subscribe();
        }

        function loadFriends() {
            renderFriends();
        }
    </script>
</body>
</html>
